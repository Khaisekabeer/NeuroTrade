# docker-compose.yml — Neuro Trade Unified System
#
# Usage:
#   docker-compose up --build    (start everything)
#   docker-compose up -d         (start in background)
#   docker-compose logs -f       (view logs)
#
# Architecture:
#   - backend  (Python FastAPI on port 8000) → AI engine, Llama 3, ccxt trading
#   - frontend (Next.js on port 3000)        → UI, charts, proxy to backend

services:
  # ---- Python Backend (The Brain) ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - NODE_ENV=production
      # Pass through your .env vars
      - BITGET_API_KEY=${BITGET_API_KEY:-}
      - BITGET_API_SECRET=${BITGET_API_SECRET:-}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE:-}
      - BITGET_DEMO=${BITGET_DEMO:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - backend-models:/app/models/saved
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows container to reach Ollama on your host

  # ---- TypeScript Frontend (The Face) ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  backend-models:
    driver: local
